{% load ui %}{% if page.paginator.count %}<div class="pagination"><span class="muted">Показано {{ page.start_index }}–{{ page.end_index }} із {{ page.paginator.count }}</span><div>{% if page.has_previous %}<a class="button small" href="{% query page=page.previous_page_number %}">Попередня</a>{% endif %}{% if page.has_next %}<a class="button small" href="{% query page=page.next_page_number %}">Наступна {% icon 'right' %}</a>{% endif %}</div></div>{% endif %}
