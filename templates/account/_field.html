<div class="field {% if field.errors %}invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>{{ field }}{% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}{% if field.help_text and field.field.widget.input_type != 'password' %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}</div>
