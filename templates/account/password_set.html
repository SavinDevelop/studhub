{% extends "students/base.html" %}
{% block title %}Встановити пароль — StudHub{% endblock %}
{% block student_content %}
<a class="back-link" href="{% url 'students:account_settings' %}">← До налаштувань акаунту</a>
<div class="page-heading"><div><h1>Встановити пароль</h1><p class="muted">Додай пароль для входу за електронною поштою.</p></div></div>
<section class="workspace-panel narrow-panel"><form method="post" action="{% url 'account_set_password' %}" class="settings-form">
  {% csrf_token %}{{ redirect_field }}{{ form.as_p }}
  <button class="workspace-button primary" type="submit">Встановити пароль</button>
</form></section>
{% endblock %}
