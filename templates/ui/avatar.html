<span class="avatar {% if size %}{{ size }}{% endif %}">{% if user.student_profile.avatar_url %}<img src="{{ user.student_profile.avatar_url }}" alt="" referrerpolicy="no-referrer">{% else %}{{ user.student_profile.first_name|default:user.first_name|slice:':1' }}{{ user.student_profile.last_name|default:user.last_name|slice:':1' }}{% endif %}</span>
